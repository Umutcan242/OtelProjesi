<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap'>
  <link rel="stylesheet" href="./css/login.css">
  <script src="./js/app.js"></script>
</head>
<body>
  <section id="section1">
    <video autoplay loop muted plays-inline src="./image/Adsız tasarım.mp4"></video>
  </section>

  <div class="screen-1">
    <div class="header">
      <h1>Giriş Yap</h1>
      <hr>
    </div>
    <div class="email">
      <label for="email">Email Address</label>
      <div class="sec-2">
        <ion-icon name="mail-outline"></ion-icon>
        <input id="email" type="email" name="email" placeholder="Username@gmail.com"/>
      </div>
    </div>
    <div class="password">
      <label for="password">Password</label>
      <div class="sec-2">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input id="password" class="pas" type="password" name="password" placeholder="············"/>
        <ion-icon class="show-hide" name="eye-outline"></ion-icon>
      </div>
    </div>
    <div class="footer"><span>Forgot Password?</span></div>
    <button class="login">Giriş Yap</button>
    <button class="SignUp">Kayıt Ol </button>
  </div>

  <script>
     document.querySelector(".SignUp").addEventListener("click", function() {
    window.location.href = "./signUp.html";
});

    document.querySelector(".login").addEventListener("click", async () => {
      const email = document.querySelector('input[name="email"]').value;
      const password = document.querySelector('input[name="password"]').value;
  
      try {
        const response = await fetch("http://localhost:3000/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ email, password }),
        });
  
        const data = await response.json();
        if (response.ok) {
         
          console.log("Kullanıcı:", data.message);
  
          // API'den gelen yönlendirme bilgisini kullanarak kullanıcıyı ilgili sayfaya yönlendirme
          window.location.href = data.redirect;
        } else {
          alert(data.error);
        }
      } catch (err) {
        console.error("Hata:", err);
        alert("Sunucuyla bağlantı kurulamadı.");
      }
    });
  </script>
</body>
</html>
